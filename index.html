<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexicoMingle - Find Your Match, Chat & Mingle 🇲🇽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#fffaf5;color:#1a1a1a}
header{background:linear-gradient(135deg,#006847 0%,#006847 33%,#fff 33%,#fff 66%,#CE1126 66%);padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:26px;color:#CE1126;letter-spacing:-1px;background:white;padding:6px 14px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.logo span{color:#006847}
nav a{margin-left:14px;text-decoration:none;color:#222;font-weight:600;font-size:14px}
.hero{background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),url('https://images.unsplash.com/photo-1518638150340-f706e86654b8?auto=format&fit=crop&w=1200&q=80');background-size:cover;background-position:center;color:white;padding:90px 24px;text-align:center}
.hero h1{font-size:42px;line-height:1.1;margin-bottom:14px;font-weight:900}
.hero p{font-size:18px;opacity:.9;max-width:520px;margin:0 auto 24px}
.btn{display:inline-block;padding:16px 36px;border-radius:100px;font-weight:800;text-decoration:none;margin:6px}
.btn-primary{background:#CE1126;color:white}
